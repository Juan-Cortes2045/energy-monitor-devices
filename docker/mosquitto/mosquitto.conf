# =============================================================================
# EnergyMonitor - Mosquitto 2 + mosquitto-go-auth (ADR-007)
# =============================================================================
# The same file serves development and production. The only differences are
# where the name "backend" resolves (see docker-compose*.yml) and which
# certificate is in ./certs.

per_listener_settings false
allow_anonymous false

# -----------------------------------------------------------------------------
# Internal listener, no TLS: for the backend only.
# docker-compose.yml publishes it on 127.0.0.1 and docker-compose.prod.yml does
# not publish it at all, so it is never exposed to the network.
# -----------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# -----------------------------------------------------------------------------
# Device listener: MQTT over TLS.
# Credentials (device_code / api_key) travel over the internet, which is why
# this is the only port open to the outside.
# Development: certificate from the development CA (generate-dev-certs.sh).
# Production: Let's Encrypt certificate for the broker domain.
# -----------------------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# -----------------------------------------------------------------------------
# Authentication and ACL delegated to the backend
# -----------------------------------------------------------------------------
# The backend is the single source of truth: a device registered in the
# `device` table can connect without touching the broker. See
# device/adapter/in/web/BrokerAuthController.java in the backend.
#   POST /internal/mqtt/auth/user  {username, password, clientid}       -> 200 / 403
#   POST /internal/mqtt/auth/acl   {username, clientid, topic, acc}     -> 200 / 403
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host backend
auth_opt_http_port 8080
auth_opt_http_getuser_uri /internal/mqtt/auth/user
auth_opt_http_aclcheck_uri /internal/mqtt/auth/acl
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_method POST
auth_opt_http_timeout 5
auth_opt_disable_superuser true
auth_opt_log_level info

# Decision cache: avoids one HTTP call per publish (one per minute per device).
# Revoking a device takes at most this long.
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 300
auth_opt_acl_cache_seconds 300
auth_opt_auth_jitter_seconds 30
auth_opt_acl_jitter_seconds 30

# -----------------------------------------------------------------------------
# Persistence and logs
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
